<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#15171c; --muted:#6b7280;
  --accent:#2563eb; --accent2:#16a34a; --danger:#dc2626; --border:#e5e7eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#1a1d24; --text:#f4f5f7; --muted:#9ca3af;
    --accent:#3b82f6; --accent2:#22c55e; --danger:#ef4444; --border:#2a2e37;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#1a1d24; --text:#f4f5f7; --muted:#9ca3af;
  --accent:#3b82f6; --accent2:#22c55e; --danger:#ef4444; --border:#2a2e37;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 90px;}
h1{font-size:1.2rem;margin:8px 0 16px;text-align:center;}
.tabs{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10;}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:0.8rem;font-weight:600;color:var(--muted);cursor:pointer;}
.tab.active{background:var(--accent);color:#fff;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.muted{color:var(--muted);font-size:0.85rem;}
button{border:none;border-radius:10px;padding:10px 14px;font-size:0.9rem;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 10px;font-size:0.8rem;}
input,textarea,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:0.9rem;}
label{font-size:0.75rem;color:var(--muted);display:block;margin:8px 0 3px;}
.set-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;}
.hidden{display:none;}
.ex-block{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
.ex-title{font-weight:600;margin-bottom:6px;}
textarea{min-height:120px;font-family:monospace;font-size:0.8rem;}
.pill{display:inline-block;background:var(--border);border-radius:999px;padding:2px 8px;font-size:0.7rem;margin-right:4px;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;}
.phase-label{font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;text-align:center;}
.phase-label.work{color:var(--accent2);}
.phase-label.rest{color:var(--danger);}
.phase-label.idle{color:var(--muted);}
.time-display{font-size:3.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1;}
.timer-meta{text-align:center;color:var(--muted);margin-top:6px;}
.setup-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);}
.dot.done{background:var(--accent);}
.dot.current{background:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Workout Tracker</h1>
  <div id="content"></div>
</div>
<div class="tabs">
  <div class="tab" data-tab="log">Log</div>
  <div class="tab" data-tab="history">History</div>
  <div class="tab" data-tab="templates">Templates</div>
  <div class="tab" data-tab="timer">Timer</div>
</div>

<script>
const KEY_T = 'wt_templates', KEY_L = 'wt_logs';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(key, fallback){ try{return JSON.parse(localStorage.getItem(key))||fallback;}catch(e){return fallback;} }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let templates = load(KEY_T, null);
if(templates === null){
  templates = [{
    id: uid(), name: "Full Body Strength (20 min)",
    exercises: [
      {name:"Goblet Squat", targetSets:4, targetReps:"12-15", equipment:"8kg kettlebell"},
      {name:"Renegade Row", targetSets:4, targetReps:"8-10/side", equipment:"2x5kg dumbbells"},
      {name:"Kettlebell Swing", targetSets:4, targetReps:"15-20", equipment:"8kg kettlebell"},
      {name:"Push-Up", targetSets:4, targetReps:"AMRAP", equipment:"Bodyweight"},
      {name:"Farmer's Carry", targetSets:4, targetReps:"30-40 sec", equipment:"2x5kg dumbbells"}
    ]
  }];
  save(KEY_T, templates);
}
let logs = load(KEY_L, []);
let activeTab = 'log';
let session = null; // in-progress logging session
let editingLog = null; // history entry currently being edited
let editingTemplate = null; // template currently being edited

const content = document.getElementById('content');
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ activeTab = t.dataset.tab; render(); });
});

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===activeTab));
  if(activeTab==='log') renderLog();
  else if(activeTab==='history') renderHistory();
  else if(activeTab==='timer') renderTimerTab();
  else renderTemplates();
}

// ---------- LOG TAB ----------
function renderLog(){
  if(session){ renderSession(); return; }
  let html = '<div class="card"><div class="muted">Pick a template to start logging</div></div>';
  if(templates.length===0){
    html += '<div class="empty">No templates yet. Add one in the Templates tab.</div>';
  } else {
    templates.forEach(t=>{
      html += `<div class="card row">
        <div><div style="font-weight:600">${esc(t.name)}</div>
        <div class="muted">${t.exercises.length} exercises</div></div>
        <button class="btn-primary btn-sm" onclick="startSession('${t.id}')">Start</button>
      </div>`;
    });
  }
  html += `<div class="card row"><div class="muted">Or log without a template</div>
    <button class="btn-secondary btn-sm" onclick="startSession(null)">Freeform</button></div>`;
  content.innerHTML = html;
}

window.startSession = function(templateId){
  const t = templateId ? templates.find(x=>x.id===templateId) : null;
  session = {
    templateId: t?t.id:null,
    templateName: t?t.name:"Freeform Workout",
    date: new Date().toISOString(),
    exercises: t ? t.exercises.map(e=>({name:e.name, target:`${e.targetSets}x${e.targetReps}`, sets:Array.from({length:e.targetSets||3},()=>({reps:'',weight:''}))}))
                 : [],
    notes:''
  };
  render();
};

function renderSession(){
  let html = `<div class="card"><div style="font-weight:600">${esc(session.templateName)}</div>
    <div class="muted">${new Date(session.date).toLocaleDateString()}</div></div>`;
  session.exercises.forEach((ex, i)=>{
    html += `<div class="card ex-block" style="border-top:none">
      <div class="ex-title">${esc(ex.name)} <span class="pill">${esc(ex.target||'')}</span></div>`;
    ex.sets.forEach((s, si)=>{
      html += `<div class="set-row">
        <input placeholder="Set ${si+1} reps" value="${esc(s.reps)}" oninput="updateSet(${i},${si},'reps',this.value)">
        <input placeholder="Weight (kg)" value="${esc(s.weight)}" oninput="updateSet(${i},${si},'weight',this.value)">
        <span class="muted">kg</span>
        <button class="btn-secondary btn-sm" onclick="removeSet(${i},${si})">✕</button>
      </div>`;
    });
    html += `<button class="btn-secondary btn-sm" onclick="addSet(${i})">+ Set</button>
      <button class="btn-danger btn-sm" onclick="removeExercise(${i})">Remove exercise</button>
    </div>`;
  });
  html += `<div class="card">
    <button class="btn-secondary" onclick="addExercise()">+ Add exercise</button>
  </div>
  <div class="card">
    <label>Notes</label>
    <textarea style="min-height:60px" oninput="session.notes=this.value">${esc(session.notes)}</textarea>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn-secondary" style="flex:1" onclick="session=null;render()">Cancel</button>
    <button class="btn-primary" style="flex:1" onclick="finishSession()">Save Workout</button>
  </div>`;
  content.innerHTML = html;
}
window.updateSet = (i,si,field,val)=>{ session.exercises[i].sets[si][field]=val; };
window.addSet = (i)=>{ session.exercises[i].sets.push({reps:'',weight:''}); renderSession(); };
window.removeSet = (i,si)=>{ session.exercises[i].sets.splice(si,1); renderSession(); };
window.removeExercise = (i)=>{ session.exercises.splice(i,1); renderSession(); };
window.addExercise = ()=>{
  const name = prompt("Exercise name?");
  if(!name) return;
  session.exercises.push({name, target:'', sets:[{reps:'',weight:''}]});
  renderSession();
};
window.finishSession = ()=>{
  logs.unshift({id:uid(), ...session});
  save(KEY_L, logs);
  session = null;
  activeTab='history';
  render();
};

// ---------- HISTORY TAB ----------
function renderHistory(){
  if(editingLog){ renderEditLog(); return; }
  if(logs.length===0){ content.innerHTML = '<div class="empty">No workouts logged yet.</div>'; return; }
  let html='';
  logs.forEach(l=>{
    const setCount = l.exercises.reduce((a,e)=>a+e.sets.length,0);
    html += `<div class="card">
      <div class="row" style="cursor:pointer" onclick="toggleLog('${l.id}')">
        <div><div style="font-weight:600">${esc(l.templateName)}</div>
        <div class="muted">${new Date(l.date).toLocaleDateString()} · ${l.exercises.length} exercises · ${setCount} sets</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn-secondary btn-sm" onclick="event.stopPropagation();editLogStart('${l.id}')">Edit</button>
          <button class="btn-danger btn-sm" onclick="event.stopPropagation();deleteLog('${l.id}')">Delete</button>
        </div>
      </div>
      <div id="detail-${l.id}" class="hidden" style="margin-top:10px">
        ${l.exercises.map(e=>`<div class="ex-block">
          <div class="ex-title">${esc(e.name)}</div>
          <div class="muted">${e.sets.map(s=>`${esc(s.reps)||'-'}${s.weight?(' @ '+esc(s.weight)+'kg'):''}`).join(', ')}</div>
        </div>`).join('')}
        ${l.notes?`<div class="muted" style="margin-top:8px">Notes: ${esc(l.notes)}</div>`:''}
      </div>
    </div>`;
  });
  content.innerHTML = html;
}
window.toggleLog = (id)=>{ document.getElementById('detail-'+id).classList.toggle('hidden'); };
window.deleteLog = (id)=>{
  if(!confirm('Delete this workout log?')) return;
  logs = logs.filter(l=>l.id!==id); save(KEY_L, logs); renderHistory();
};

window.editLogStart = (id)=>{
  const l = logs.find(x=>x.id===id);
  if(!l) return;
  editingLog = JSON.parse(JSON.stringify(l));
  render();
};

function renderEditLog(){
  const dateVal = new Date(editingLog.date).toISOString().slice(0,10);
  let html = `<div class="card">
    <label>Workout name</label>
    <input value="${esc(editingLog.templateName)}" oninput="editingLog.templateName=this.value">
    <label>Date</label>
    <input type="date" value="${dateVal}" onchange="editingLog.date=new Date(this.value).toISOString()">
  </div>`;
  editingLog.exercises.forEach((ex,i)=>{
    html += `<div class="card ex-block" style="border-top:none">
      <input value="${esc(ex.name)}" oninput="editingLog.exercises[${i}].name=this.value" style="font-weight:600;margin-bottom:8px">`;
    ex.sets.forEach((s,si)=>{
      html += `<div class="set-row">
        <input placeholder="Reps" value="${esc(s.reps)}" oninput="editingLog.exercises[${i}].sets[${si}].reps=this.value">
        <input placeholder="Weight (kg)" value="${esc(s.weight)}" oninput="editingLog.exercises[${i}].sets[${si}].weight=this.value">
        <span class="muted">kg</span>
        <button class="btn-secondary btn-sm" onclick="editingLog.exercises[${i}].sets.splice(${si},1);renderEditLog()">✕</button>
      </div>`;
    });
    html += `<button class="btn-secondary btn-sm" onclick="editingLog.exercises[${i}].sets.push({reps:'',weight:''});renderEditLog()">+ Set</button>
      <button class="btn-danger btn-sm" onclick="editingLog.exercises.splice(${i},1);renderEditLog()">Remove exercise</button>
    </div>`;
  });
  html += `<div class="card">
    <button class="btn-secondary" onclick="const n=prompt('Exercise name?');if(n){editingLog.exercises.push({name:n,target:'',sets:[{reps:'',weight:''}]});renderEditLog();}">+ Add exercise</button>
  </div>
  <div class="card">
    <label>Notes</label>
    <textarea style="min-height:60px" oninput="editingLog.notes=this.value">${esc(editingLog.notes||'')}</textarea>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn-secondary" style="flex:1" onclick="editingLog=null;renderHistory()">Cancel</button>
    <button class="btn-primary" style="flex:1" onclick="saveEditLog()">Save Changes</button>
  </div>`;
  content.innerHTML = html;
}
window.saveEditLog = ()=>{
  const idx = logs.findIndex(x=>x.id===editingLog.id);
  if(idx>-1) logs[idx]=editingLog;
  save(KEY_L, logs);
  editingLog=null;
  renderHistory();
};

// ---------- TEMPLATES TAB ----------
function renderTemplates(){
  if(editingTemplate){ renderEditTemplate(); return; }
  let html = '';
  templates.forEach(t=>{
    html += `<div class="card">
      <div class="row"><div style="font-weight:600">${esc(t.name)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn-secondary btn-sm" onclick="editTemplateStart('${t.id}')">Edit</button>
          <button class="btn-danger btn-sm" onclick="deleteTemplate('${t.id}')">Delete</button>
        </div></div>
      <div class="muted">${t.exercises.map(e=>esc(e.name)).join(', ')}</div>
    </div>`;
  });
  html += `<div class="card">
    <div style="font-weight:600;margin-bottom:6px">Import a workout (paste JSON)</div>
    <div class="muted" style="margin-bottom:8px">Paste a template Claude gave you, or a batch export, then tap Import.</div>
    <textarea id="importBox" placeholder='{"name":"...","exercises":[{"name":"...","targetSets":3,"targetReps":"10","equipment":"..."}]}'></textarea>
    <div class="row" style="gap:10px;margin-top:8px">
      <button class="btn-primary" style="flex:1" onclick="importJSON()">Import</button>
      <button class="btn-secondary" style="flex:1" onclick="exportAll()">Export All (backup)</button>
    </div>
  </div>`;
  content.innerHTML = html;
}
window.deleteTemplate = (id)=>{
  if(!confirm('Delete this template?')) return;
  templates = templates.filter(t=>t.id!==id); save(KEY_T, templates); renderTemplates();
};

window.editTemplateStart = (id)=>{
  const t = templates.find(x=>x.id===id);
  if(!t) return;
  editingTemplate = JSON.parse(JSON.stringify(t));
  render();
};

function renderEditTemplate(){
  let html = `<div class="card">
    <label>Workout name</label>
    <input value="${esc(editingTemplate.name)}" oninput="editingTemplate.name=this.value">
  </div>`;
  editingTemplate.exercises.forEach((ex,i)=>{
    html += `<div class="card ex-block" style="border-top:none">
      <input value="${esc(ex.name)}" oninput="editingTemplate.exercises[${i}].name=this.value" style="font-weight:600;margin-bottom:8px">
      <div class="set-row">
        <div><label>Sets</label><input type="number" value="${esc(ex.targetSets)}" oninput="editingTemplate.exercises[${i}].targetSets=parseInt(this.value)||1"></div>
        <div><label>Reps/target</label><input value="${esc(ex.targetReps)}" oninput="editingTemplate.exercises[${i}].targetReps=this.value"></div>
        <div><label>Equipment</label><input value="${esc(ex.equipment||'')}" oninput="editingTemplate.exercises[${i}].equipment=this.value"></div>
        <button class="btn-danger btn-sm" onclick="editingTemplate.exercises.splice(${i},1);renderEditTemplate()">✕</button>
      </div>
    </div>`;
  });
  html += `<div class="card">
    <button class="btn-secondary" onclick="const n=prompt('Exercise name?');if(n){editingTemplate.exercises.push({name:n,targetSets:3,targetReps:'',equipment:''});renderEditTemplate();}">+ Add exercise</button>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn-secondary" style="flex:1" onclick="editingTemplate=null;renderTemplates()">Cancel</button>
    <button class="btn-primary" style="flex:1" onclick="saveEditTemplate()">Save Changes</button>
  </div>`;
  content.innerHTML = html;
}
window.saveEditTemplate = ()=>{
  const idx = templates.findIndex(x=>x.id===editingTemplate.id);
  if(idx>-1) templates[idx]=editingTemplate;
  save(KEY_T, templates);
  editingTemplate=null;
  renderTemplates();
};
window.importJSON = ()=>{
  const raw = document.getElementById('importBox').value.trim();
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ alert('Invalid JSON: '+e.message); return; }
  const arr = Array.isArray(parsed) ? parsed : (parsed.templates ? parsed.templates : [parsed]);
  let added = 0;
  arr.forEach(t=>{
    if(t && t.name && Array.isArray(t.exercises)){
      templates.push({id: uid(), name: t.name, exercises: t.exercises});
      added++;
    }
  });
  if(added===0){ alert('No valid templates found in that JSON.'); return; }
  save(KEY_T, templates);
  renderTemplates();
};
window.exportAll = ()=>{
  const data = JSON.stringify({templates, logs}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workout-backup.json'; a.click();
  URL.revokeObjectURL(url);
};

// ---------- TIMER TAB ----------
let audioCtx = null;
let T = { running:false, phase:'idle', round:1, remaining:40, work:40, rest:20, rounds:20, intervalId:null };

function tfmt(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=(s%60).toString().padStart(2,'0'); return m+':'+sec; }
function beep(freq,dur){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.frequency.value=freq; osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function renderTimerTab(){
  content.innerHTML = `
  <div class="card">
    <div class="setup-grid">
      <div><label>Work (sec)</label><input type="number" id="twork" value="${T.work}" ${T.phase!=='idle'?'disabled':''} onchange="T.work=parseInt(this.value)||1"></div>
      <div><label>Rest (sec)</label><input type="number" id="trest" value="${T.rest}" ${T.phase!=='idle'?'disabled':''} onchange="T.rest=parseInt(this.value)||0"></div>
      <div><label>Rounds</label><input type="number" id="trounds" value="${T.rounds}" ${T.phase!=='idle'?'disabled':''} onchange="T.rounds=parseInt(this.value)||1"></div>
    </div>
  </div>
  <div class="card">
    <div class="phase-label ${T.phase}" id="tPhase">${T.phase==='idle'?'Ready':T.phase==='work'?'Work':T.phase==='rest'?'Rest':'Done!'}</div>
    <div class="time-display" id="tTime">${tfmt(T.remaining)}</div>
    <div class="timer-meta" id="tMeta">${T.phase==='idle'?'Round 1 of '+T.rounds:'Round '+T.round+' of '+T.rounds}</div>
    <div class="dots" id="tDots"></div>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn-secondary" style="flex:1" onclick="timerReset()">Reset</button>
    <button class="btn-primary" style="flex:1" id="tStartBtn" onclick="timerToggle()">${T.running?'Pause':(T.phase==='idle'||T.phase==='done')?'Start':'Resume'}</button>
  </div>`;
  renderDots();
}

function renderDots(){
  const el = document.getElementById('tDots'); if(!el) return;
  el.innerHTML='';
  const max = Math.min(T.rounds, 40);
  for(let i=1;i<=max;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<T.round?' done':(i===T.round && T.running?' current':''));
    el.appendChild(d);
  }
}

function updateTimerDOM(){
  if(activeTab!=='timer') return;
  const phaseEl=document.getElementById('tPhase'), timeEl=document.getElementById('tTime'),
        metaEl=document.getElementById('tMeta'), startBtn=document.getElementById('tStartBtn');
  if(!phaseEl) return;
  phaseEl.className='phase-label '+T.phase;
  phaseEl.textContent = T.phase==='idle'?'Ready':T.phase==='work'?'Work':T.phase==='rest'?'Rest':'Done!';
  timeEl.textContent = tfmt(T.remaining);
  metaEl.textContent = T.phase==='rest' ? 'Next: Round '+(T.round+1)+' of '+T.rounds
                      : T.phase==='done' ? 'Nice work — '+T.rounds+' rounds complete'
                      : 'Round '+T.round+' of '+T.rounds;
  if(startBtn) startBtn.textContent = T.running?'Pause':(T.phase==='idle'||T.phase==='done')?'Start':'Resume';
  renderDots();
}

window.timerToggle = ()=>{ T.running ? timerPause() : timerStart(); };

function timerStart(){
  if(T.phase==='idle' || T.phase==='done'){
    T.round=1; T.phase='work'; T.remaining=T.work;
  }
  T.running=true;
  clearInterval(T.intervalId);
  T.intervalId=setInterval(timerTick,1000);
  updateTimerDOM();
}
function timerPause(){ T.running=false; clearInterval(T.intervalId); updateTimerDOM(); }
window.timerReset = ()=>{
  clearInterval(T.intervalId);
  T.running=false; T.phase='idle'; T.round=1; T.remaining=T.work;
  renderTimerTab();
};

function timerTick(){
  T.remaining -= 1;
  if(T.remaining<=3 && T.remaining>0 && (T.phase==='work'||T.phase==='rest')) beep(880,0.08);
  if(T.remaining<=0) timerAdvance(); else updateTimerDOM();
}
function timerAdvance(){
  if(T.phase==='work'){
    beep(660,0.15);
    if(T.rest>0 && T.round<T.rounds){ T.phase='rest'; T.remaining=T.rest; }
    else if(T.round<T.rounds){ T.round+=1; T.phase='work'; T.remaining=T.work; }
    else { return timerFinish(); }
  } else if(T.phase==='rest'){
    beep(660,0.15);
    T.round+=1;
    if(T.round>T.rounds) return timerFinish();
    T.phase='work'; T.remaining=T.work;
  }
  updateTimerDOM();
}
function timerFinish(){
  beep(523,0.2); setTimeout(()=>beep(659,0.2),180); setTimeout(()=>beep(784,0.3),360);
  T.phase='done'; T.running=false; clearInterval(T.intervalId);
  updateTimerDOM();
}

function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

render();
</script>
